          - listitem [ref=f1e135]: 學生：註冊時班級代碼選填，之後也能在「我的帳號」補填；用分享連結作答時若有登入，家長之後不用等你傳連結就能直接查到進度（作答開始畫面最上方會看到登入狀態）
          - listitem [ref=f1e136]: 家長：登入後在「我的帳號」輸入孩子的帳號名稱連結（不需孩子同意），連結後可直接查即時進度＋監考式詳情；若孩子沒登入純用分享連結作答，仍可請孩子手動分享「即時進度連結」給你查看（僅進度%）
